name: Package and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (for example v2.0.0)
        required: true
        default: v2.0.0
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  extension-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
          else
            version="v2.0.0"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Validate extension manifest
        shell: bash
        run: |
          python -m json.tool manifest.json >/dev/null
          test -f content.js
          test -f popup.html
          test -f popup.js
          test -f icon.png

      - name: Build extension ZIP
        shell: bash
        run: |
          package="PowerBookmark-${VERSION}-Chromium"
          mkdir -p "$package"
          cp manifest.json content.js popup.html popup.js icon.png "$package/"
          cp README.md "$package/README.md"
          zip -r "${package}.zip" "$package"
          sha256sum "${package}.zip" > "${package}.zip.sha256"
          echo "ZIP_NAME=${package}.zip" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$ZIP_NAME" "$ZIP_NAME.sha256" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$VERSION" "$ZIP_NAME" "$ZIP_NAME.sha256" --target "${{ github.sha }}" --title "PowerBookmark ${VERSION}" --notes "Chromium extension package for Chrome/Edge. Unzip the archive and load the extracted folder as an unpacked extension in developer mode." --repo "${{ github.repository }}"
          fi
